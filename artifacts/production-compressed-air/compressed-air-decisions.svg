<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" role="img" aria-labelledby="title desc"><title id="title">Pouch Factory compressed air: expansion allowance and first-line operation</title><desc id="desc">Functional air-supply arrangement from a rented KAESER AIRCENTER package through added filtration and distribution to the first production line. A dashed branch represents planned second-line demand, which was not exercised. Capacity allowance, rental cost choice, and higher-duty-cycle tradeoff are owner-reported; numerical sizing records are not retained.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1764C0"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B95412"/></marker></defs><rect width="1080" height="1200" fill="#FFFFFF"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="56" y="57" fill="#1764C0" font-size="22" font-weight="700" text-anchor="start"><tspan x="56" dy="0">POUCH FACTORY / COMPRESSED-AIR INTEGRATION</tspan></text><text x="56" y="128" fill="#142434" font-size="50" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Size for two lines.</tspan><tspan x="56" dy="60">Supply the first.</tspan></text><text x="56" y="225" fill="#617285" font-size="27" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Expansion allowance and the first line’s initial run</tspan></text><rect x="56" y="323" width="260" height="222" rx="10" fill="#F6F8FA" stroke="#142434" stroke-width="3" /><text x="186" y="372" fill="#142434" font-size="28" font-weight="700" text-anchor="middle"><tspan x="186" dy="0">Rented KAESER</tspan><tspan x="186" dy="37">AIRCENTER</tspan></text><rect x="91" y="421" width="190" height="64" rx="4" fill="#E7EDF3" stroke="#BAC7D5" stroke-width="3" /><line x1="102" y1="434" x2="268" y2="434" stroke="#617285" stroke-width="2" /><line x1="102" y1="442" x2="268" y2="442" stroke="#617285" stroke-width="2" /><line x1="102" y1="450" x2="268" y2="450" stroke="#617285" stroke-width="2" /><line x1="102" y1="458" x2="268" y2="458" stroke="#617285" stroke-width="2" /><line x1="102" y1="466" x2="268" y2="466" stroke="#617285" stroke-width="2" /><text x="186" y="519" fill="#617285" font-size="25" font-weight="400" text-anchor="middle"><tspan x="186" dy="0">Supply package</tspan></text><line x1="324" y1="434" x2="394" y2="434" stroke="#1764C0" stroke-width="5" marker-end="url(#blue)" /><path d="M 464 365 L 520 434 L 464 503 L 408 434 Z" fill="none" stroke="#1764C0" stroke-width="4" /><text x="464" y="554" fill="#142434" font-size="27" font-weight="700" text-anchor="middle"><tspan x="464" dy="0">Added</tspan><tspan x="464" dy="34">filtration</tspan></text><line x1="528" y1="434" x2="620" y2="434" stroke="#1764C0" stroke-width="5" marker-end="url(#blue)" /><path d="M 636 434 H 735 V 342 H 807" fill="none" stroke="#1764C0" stroke-width="5" marker-end="url(#blue)"/><path d="M 735 434 V 644 H 807" fill="none" stroke="#617285" stroke-width="4" stroke-dasharray="10 9"/><circle cx="735" cy="434" r="7" fill="#1764C0"/><text x="658" y="393" fill="#617285" font-size="22" font-weight="400" text-anchor="middle"><tspan x="658" dy="0">Distribution</tspan></text><rect x="820" y="274" width="204" height="141" rx="14" fill="#EDF4FC" stroke="#1764C0" stroke-width="3" /><text x="922" y="321" fill="#142434" font-size="29" font-weight="700" text-anchor="middle"><tspan x="922" dy="0">Line 1</tspan><tspan x="922" dy="41">Initial run</tspan></text><text x="922" y="465" fill="#1764C0" font-size="25" font-weight="700" text-anchor="middle"><tspan x="922" dy="0">Supply kept up</tspan><tspan x="922" dy="33">Owner-reported</tspan></text><rect x="820" y="575" width="204" height="145" rx="12" fill="#FFFFFF" stroke="#617285" stroke-width="3" stroke-dasharray="9 7"/><text x="922" y="624" fill="#142434" font-size="29" font-weight="700" text-anchor="middle"><tspan x="922" dy="0">Line 2</tspan><tspan x="922" dy="39">Planned</tspan></text><text x="922" y="765" fill="#617285" font-size="24" font-weight="400" text-anchor="middle"><tspan x="922" dy="0">Not yet ordered</tspan></text><text x="56" y="655" fill="#1764C0" font-size="22" font-weight="700" text-anchor="start"><tspan x="56" dy="0">CAPACITY BASIS</tspan></text><text x="56" y="708" fill="#142434" font-size="30" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Peak line demand</tspan><tspan x="56" dy="42"> + future-line allowance</tspan><tspan x="56" dy="42"> + headroom</tspan></text><line x1="56" y1="828" x2="1024" y2="828" stroke="#BAC7D5" stroke-width="2" /><text x="56" y="884" fill="#142434" font-size="32" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Rent the package</tspan></text><text x="56" y="926" fill="#617285" font-size="27" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Lower initial spend</tspan><tspan x="56" dy="34">than available purchases</tspan></text><text x="569" y="884" fill="#142434" font-size="32" font-weight="700" text-anchor="start"><tspan x="569" dy="0">No extra receiver</tspan></text><text x="569" y="926" fill="#617285" font-size="27" font-weight="400" text-anchor="start"><tspan x="569" dy="0">Higher compressor</tspan><tspan x="569" dy="34">duty cycle accepted</tspan></text><text x="56" y="1048" fill="#142434" font-size="29" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Second-line capacity was not exercised.</tspan></text><line x1="56" y1="1089" x2="1024" y2="1089" stroke="#BAC7D5" stroke-width="2" /><text x="56" y="1128" fill="#617285" font-size="22" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Functional reconstruction • sizing and cost values not retained</tspan></text><text x="56" y="1166" fill="#617285" font-size="21" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Source: projects/production-compressed-air.md</tspan></text></g></svg>
