<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" role="img" aria-labelledby="title desc"><title id="title">Maybell prototype: one interface for readouts and valve commands</title><desc id="desc">Functional reconstruction of Tucker's Lake Shore Model 372 wiring and readout integration with a LattePanda, other system measurements displayed in one GUI, and operator commands to pneumatic gas-handling valves. The diagram describes roles and flow, not acquisition wiring or control electronics.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1764C0"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B95412"/></marker></defs><rect width="1080" height="1200" fill="#FFFFFF"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="56" y="57" fill="#1764C0" font-size="22" font-weight="700" text-anchor="start"><tspan x="56" dy="0">MAYBELL / INSTRUMENTATION INTEGRATION</tspan></text><text x="56" y="128" fill="#142434" font-size="50" font-weight="700" text-anchor="start"><tspan x="56" dy="0">One interface for readouts</tspan><tspan x="56" dy="60">and valve commands</tspan></text><text x="56" y="225" fill="#617285" font-size="27" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Measurement and command paths share the GUI</tspan></text><text x="56" y="302" fill="#1764C0" font-size="23" font-weight="700" text-anchor="start"><tspan x="56" dy="0">MEASUREMENT PATH</tspan></text><rect x="56" y="338" width="318" height="175" rx="14" fill="#EDF4FC" stroke="#1764C0" stroke-width="3" /><text x="80" y="385" fill="#142434" font-size="29" font-weight="700" text-anchor="start"><tspan x="80" dy="0">Lake Shore 372</tspan><tspan x="80" dy="37">readout</tspan></text><rect x="82" y="447" width="120" height="35" rx="4" fill="#FFFFFF" stroke="#BAC7D5" stroke-width="3" /><line x1="216" y1="459" x2="334" y2="459" stroke="#1764C0" stroke-width="3" /><line x1="216" y1="474" x2="303" y2="474" stroke="#1764C0" stroke-width="3" /><rect x="427" y="365" width="224" height="128" rx="14" fill="#EDF4FC" stroke="#1764C0" stroke-width="3" /><text x="539" y="414" fill="#142434" font-size="29" font-weight="700" text-anchor="middle"><tspan x="539" dy="0">LattePanda</tspan><tspan x="539" dy="38">integration</tspan></text><line x1="383" y1="430" x2="419" y2="430" stroke="#1764C0" stroke-width="5" marker-end="url(#blue)" /><line x1="660" y1="430" x2="733" y2="430" stroke="#1764C0" stroke-width="5" marker-end="url(#blue)" /><rect x="56" y="585" width="318" height="278" rx="14" fill="#EDF4FC" stroke="#1764C0" stroke-width="3" /><text x="80" y="630" fill="#142434" font-size="25" font-weight="700" text-anchor="start"><tspan x="80" dy="0">System</tspan><tspan x="80" dy="31">measurements</tspan></text><text x="80" y="707" fill="#142434" font-size="29" font-weight="400" text-anchor="start"><tspan x="80" dy="0">Pressure</tspan><tspan x="80" dy="43">Flow</tspan><tspan x="80" dy="43">Heater output</tspan><tspan x="80" dy="43">Valve state</tspan></text><path d="M 380 720 H 405 V 532 H 539 V 503" fill="none" stroke="#1764C0" stroke-width="5" marker-end="url(#blue)"/><rect x="744" y="351" width="280" height="356" rx="20" fill="#FFFFFF" stroke="#142434" stroke-width="3" /><text x="884" y="409" fill="#142434" font-size="34" font-weight="700" text-anchor="middle"><tspan x="884" dy="0">Unified GUI</tspan></text><line x1="766" y1="440" x2="1002" y2="440" stroke="#BAC7D5" stroke-width="2" /><text x="884" y="475" fill="#1764C0" font-size="29" font-weight="700" text-anchor="middle"><tspan x="884" dy="0">Readouts +</tspan><tspan x="884" dy="34">equipment</tspan><tspan x="884" dy="34">state</tspan></text><line x1="766" y1="565" x2="1002" y2="565" stroke="#BAC7D5" stroke-width="2" /><text x="884" y="617" fill="#B95412" font-size="28" font-weight="700" text-anchor="middle"><tspan x="884" dy="0">Valve</tspan><tspan x="884" dy="37">commands</tspan></text><text x="884" y="298" fill="#B95412" font-size="29" font-weight="700" text-anchor="middle"><tspan x="884" dy="0">Operator</tspan></text><line x1="884" y1="310" x2="884" y2="342" stroke="#B95412" stroke-width="5" marker-end="url(#orange)" /><line x1="884" y1="716" x2="884" y2="796" stroke="#B95412" stroke-width="5" marker-end="url(#orange)" /><rect x="744" y="807" width="280" height="139" rx="14" fill="#FFF4EA" stroke="#B95412" stroke-width="3" /><text x="884" y="846" fill="#142434" font-size="27" font-weight="700" text-anchor="middle"><tspan x="884" dy="0">Pneumatic</tspan><tspan x="884" dy="34">valves</tspan><tspan x="884" dy="34">Gas handling</tspan></text><text x="56" y="1008" fill="#142434" font-size="31" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Tucker's work: instrument wiring,</tspan></text><text x="56" y="1050" fill="#142434" font-size="29" font-weight="400" text-anchor="start"><tspan x="56" dy="0">readout integration, and operator controls.</tspan></text><line x1="56" y1="1089" x2="1024" y2="1089" stroke="#BAC7D5" stroke-width="2" /><text x="56" y="1128" fill="#617285" font-size="22" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Functional reconstruction • transport and control electronics unspecified</tspan></text><text x="56" y="1166" fill="#617285" font-size="21" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Source: projects/cryogenic-hardware.md</tspan></text></g></svg>
