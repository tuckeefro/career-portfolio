<title id="title">Maybell prototype instrumentation and controls</title><desc id="desc">Measurement lane: Lake Shore Model 372, pressure, flow, heater output, and valve state feed measurement integration on a LattePanda and a unified operator GUI. Command lane: an operator uses the same GUI for pneumatic gas-handling valve control. Transport protocols and interface hardware are unspecified.</desc>
