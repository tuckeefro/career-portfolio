<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" role="img" aria-labelledby="title desc"><title id="title">Waterjet repair: cutting symptom, pump inspection, and return to production</title><desc id="desc">Qualitative symptom strip shows clean through-cutting interrupted by about one inch of surface removal. The repair account records excess cylinder-assembly play, a standard 5,000-hour pump rebuild, and resumed production after three working days. Timing and results are owner-reported; this is not a measured cut trace.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1764C0"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B95412"/></marker></defs><rect width="1080" height="1200" fill="#FFFFFF"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="56" y="57" fill="#1764C0" font-size="22" font-weight="700" text-anchor="start"><tspan x="56" dy="0">WATERJET / EQUIPMENT REPAIR</tspan></text><text x="56" y="128" fill="#142434" font-size="50" font-weight="700" text-anchor="start"><tspan x="56" dy="0">From interrupted cuts</tspan><tspan x="56" dy="60">to production restart</tspan></text><text x="56" y="225" fill="#617285" font-size="27" font-weight="400" text-anchor="start"><tspan x="56" dy="0">High-pressure pump inspection and rebuild</tspan></text><text x="56" y="300" fill="#142434" font-size="32" font-weight="700" text-anchor="start"><tspan x="56" dy="0">1  Read the cutting symptom</tspan></text><text x="56" y="342" fill="#617285" font-size="26" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Cutting result along the travel path</tspan></text><rect x="56" y="370" width="968" height="70" rx="0" fill="#E7EDF3" stroke="#E7EDF3" stroke-width="3" /><rect x="56" y="370" width="250" height="70" rx="0" fill="#1764C0" stroke="#1764C0" stroke-width="3" /><rect x="306" y="370" width="310" height="70" rx="0" fill="#B95412" stroke="#B95412" stroke-width="3" /><rect x="616" y="370" width="408" height="70" rx="0" fill="#1764C0" stroke="#1764C0" stroke-width="3" /><text x="71" y="416" fill="#FFFFFF" font-size="29" font-weight="700" text-anchor="start"><tspan x="71" dy="0">Through-cut</tspan></text><text x="461" y="416" fill="#FFFFFF" font-size="27" font-weight="700" text-anchor="middle"><tspan x="461" dy="0">Surface removal</tspan></text><text x="820" y="416" fill="#FFFFFF" font-size="29" font-weight="700" text-anchor="middle"><tspan x="820" dy="0">Through-cut</tspan></text><path d="M 306 458 V 476 H 616 V 458" fill="none" stroke="#B95412" stroke-width="3" /><text x="461" y="513" fill="#B95412" font-size="28" font-weight="700" text-anchor="middle"><tspan x="461" dy="0">roughly 1 inch</tspan></text><text x="56" y="554" fill="#617285" font-size="24" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Symptom sketch; not a measured cut trace.</tspan></text><text x="56" y="625" fill="#142434" font-size="32" font-weight="700" text-anchor="start"><tspan x="56" dy="0">2  Inspect the pressure source</tspan></text><rect x="56" y="656" width="410" height="140" rx="14" fill="#EDF4FC" stroke="#1764C0" stroke-width="3" /><text x="80" y="700" fill="#142434" font-size="31" font-weight="700" text-anchor="start"><tspan x="80" dy="0">High-pressure pump</tspan></text><text x="80" y="745" fill="#142434" font-size="27" font-weight="400" text-anchor="start"><tspan x="80" dy="0">Cylinder assemblies:</tspan><tspan x="80" dy="33">more play than expected</tspan></text><line x1="478" y1="713" x2="678" y2="713" stroke="#1764C0" stroke-width="5" marker-end="url(#blue)" /><text x="578" y="687" fill="#617285" font-size="22" font-weight="400" text-anchor="middle"><tspan x="578" dy="0">Pressure supply</tspan></text><path d="M 700 683 H 910 L 863 723 H 747 Z" fill="none" stroke="#142434" stroke-width="3" /><path d="M 785 725 V 750" fill="none" stroke="#1764C0" stroke-width="5" /><text x="814" y="789" fill="#142434" font-size="28" font-weight="700" text-anchor="middle"><tspan x="814" dy="0">Cutting process</tspan></text><text x="56" y="852" fill="#142434" font-size="32" font-weight="700" text-anchor="start"><tspan x="56" dy="0">3  Carry the repair through machine checks</tspan></text><text x="56" y="895" fill="#617285" font-size="28" font-weight="400" text-anchor="start"><tspan x="56" dy="0">5,000-hour kit rebuild  →  reassemble  →  check</tspan></text><text x="56" y="982" fill="#1764C0" font-size="64" font-weight="700" text-anchor="start"><tspan x="56" dy="0">3 working days</tspan></text><text x="56" y="1032" fill="#142434" font-size="31" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Shutdown to resumed production</tspan></text><text x="56" y="1072" fill="#142434" font-size="28" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Consistent through-cutting returned.</tspan></text><line x1="56" y1="1089" x2="1024" y2="1089" stroke="#BAC7D5" stroke-width="2" /><text x="56" y="1128" fill="#617285" font-size="22" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Reconstructed from the repair account • timing and results owner-reported</tspan></text><text x="56" y="1166" fill="#617285" font-size="21" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Source: projects/fabrication-cnc.md</tspan></text></g></svg>
