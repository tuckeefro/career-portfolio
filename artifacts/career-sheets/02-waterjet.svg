<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1080 1528" role="img" aria-labelledby="title desc">
<title id="title">Waterjet pump repair engineering case</title><desc id="desc">An intermittent cutting fault led to pump inspection, a standard scheduled rebuild, and resumed production. Qualitative reconstruction. The exact failed component, pump model, and numerical pressure readings are not retained.</desc>
<defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1764C0"/></marker><marker id="command" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#99520C"/></marker></defs>
<rect width="1080" height="1528" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="60" y="65" font-size="24" font-weight="bold" fill="#617285" text-anchor="start">TUCKER VANA / CASE 02</text>
<text x="1020" y="65" font-size="26" font-weight="bold" fill="#1764C0" text-anchor="end">Fabrication / CNC</text>
<text x="60" y="146" font-size="52" font-weight="bold" fill="#142434" text-anchor="start">Investigate the cut fault.</text>
<text x="60" y="210" font-size="52" font-weight="bold" fill="#142434" text-anchor="start">Rebuild and restart.</text>
<text x="60" y="267" font-size="28" font-weight="normal" fill="#142434" text-anchor="start">I inspected the high-pressure pump, performed its scheduled</text>
<text x="60" y="304" font-size="28" font-weight="normal" fill="#142434" text-anchor="start">rebuild, reassembled it, and checked the machine after repair.</text>
<rect x="60" y="386" width="960" height="106" rx="10" fill="#EAF3FF" stroke="#1764C0" stroke-width="2"/>
<text x="84" y="431" font-size="38" font-weight="bold" fill="#1764C0" text-anchor="start">3 working days</text>
<text x="84" y="470" font-size="24" font-weight="normal" fill="#617285" text-anchor="start">Shutdown to production restart · reported in my account</text>
<text x="60" y="547" font-size="30" font-weight="bold" fill="#142434" text-anchor="start">Reported cutting pattern and supply path</text>
<text x="60" y="595" font-size="25" font-weight="normal" fill="#617285" text-anchor="start">Cut travel →</text>
<rect x="60" y="619" width="960" height="106" rx="10" fill="#F2F6FA" stroke="#D8E0E8" stroke-width="2"/>
<rect x="88" y="633" width="250" height="78" fill="#1764C0" opacity="0.30"/>
<rect x="380" y="633" width="300" height="18" fill="#99520C" opacity="0.65"/>
<rect x="724" y="633" width="268" height="78" fill="#1764C0" opacity="0.30"/>
<text x="213" y="769" font-size="28" font-weight="bold" fill="#1764C0" text-anchor="middle">Through-cut</text>
<text x="530" y="763" font-size="27" font-weight="bold" fill="#99520C" text-anchor="middle">Surface removal</text>
<text x="530" y="803" font-size="25" font-weight="normal" fill="#99520C" text-anchor="middle">~1 inch travel</text>
<text x="858" y="769" font-size="28" font-weight="bold" fill="#1764C0" text-anchor="middle">Through-cut</text>
<rect x="60" y="851" width="346" height="151" rx="10" fill="#F2F6FA" stroke="#D8E0E8" stroke-width="2"/>
<text x="233" y="908" font-size="27" font-weight="bold" fill="#142434" text-anchor="middle">High-pressure pump</text>
<text x="233" y="957" font-size="25" font-weight="normal" fill="#142434" text-anchor="middle">Inspected and rebuilt</text>
<rect x="738" y="851" width="282" height="151" rx="10" fill="#EAF3FF" stroke="#1764C0" stroke-width="2"/>
<text x="879" y="915" font-size="29" font-weight="bold" fill="#1764C0" text-anchor="middle">Cutting process</text>
<text x="879" y="958" font-size="25" font-weight="normal" fill="#142434" text-anchor="middle">Cut result checked</text>
<path d="M406 922 H728" fill="none" stroke="#1764C0" stroke-width="5" stroke-linejoin="round" marker-end="url(#flow)"/>
<text x="572" y="890" font-size="25" font-weight="normal" fill="#1764C0" text-anchor="middle">Supply path</text>
<text x="60" y="1046" font-size="24" font-weight="normal" fill="#617285" text-anchor="start">The colored strip sketches penetration; it is not a measured cut-depth trace.</text>
<text x="60" y="1105" font-size="30" font-weight="bold" fill="#142434" text-anchor="start">What I found and did</text>
<rect x="60" y="1133" width="960" height="79" rx="10" fill="#F2F6FA" stroke="#D8E0E8" stroke-width="2"/>
<text x="84" y="1167" font-size="26" font-weight="bold" fill="#1764C0" text-anchor="start">Finding</text>
<text x="287" y="1165" font-size="25" font-weight="normal" fill="#142434" text-anchor="start">More mechanical play than expected in the pump</text>
<text x="287" y="1196" font-size="25" font-weight="normal" fill="#142434" text-anchor="start">cylinder assemblies.</text>
<rect x="60" y="1220" width="960" height="79" rx="10" fill="#F2F6FA" stroke="#D8E0E8" stroke-width="2"/>
<text x="84" y="1254" font-size="26" font-weight="bold" fill="#1764C0" text-anchor="start">Action</text>
<text x="287" y="1252" font-size="25" font-weight="normal" fill="#142434" text-anchor="start">Standard 5,000-hour rebuild kit, reassembly, and</text>
<text x="287" y="1283" font-size="25" font-weight="normal" fill="#142434" text-anchor="start">machine checks.</text>
<rect x="60" y="1307" width="960" height="79" rx="10" fill="#F2F6FA" stroke="#D8E0E8" stroke-width="2"/>
<text x="84" y="1341" font-size="26" font-weight="bold" fill="#1764C0" text-anchor="start">Checks</text>
<text x="287" y="1339" font-size="25" font-weight="normal" fill="#142434" text-anchor="start">Consistent through-cuts returned; pump output</text>
<text x="287" y="1370" font-size="25" font-weight="normal" fill="#142434" text-anchor="start">readings were higher.</text>
<text x="60" y="1420" font-size="22" font-weight="normal" fill="#617285" text-anchor="start">Qualitative reconstruction. The exact failed component, pump model, and numerical</text>
<text x="60" y="1449" font-size="22" font-weight="normal" fill="#617285" text-anchor="start">pressure readings are not retained.</text>
