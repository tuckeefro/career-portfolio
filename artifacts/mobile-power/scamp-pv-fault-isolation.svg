<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" role="img" aria-labelledby="title desc"><title id="title">SCAMP solar fault isolation: installed path compared with a direct panel test</title><desc id="desc">Two functional connection arrangements compare missing PV input through the installed cable and connector path with a successful direct connection from the 200-watt portable panel to the EPEVER controller. The test narrowed the problem to the installed path. Correcting a misassembled MC4 restored input. Connector order and wiring details are not specified.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1764C0"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B95412"/></marker></defs><rect width="1080" height="1200" fill="#FFFFFF"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="56" y="57" fill="#1764C0" font-size="22" font-weight="700" text-anchor="start"><tspan x="56" dy="0">SCAMP / SOLAR TROUBLESHOOTING</tspan></text><text x="56" y="128" fill="#142434" font-size="50" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Use a bypass test</tspan><tspan x="56" dy="60">to isolate the PV fault</tspan></text><text x="56" y="225" fill="#617285" font-size="27" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Compare two connection arrangements</tspan></text><text x="56" y="303" fill="#142434" font-size="33" font-weight="700" text-anchor="start"><tspan x="56" dy="0">1  Installed path before correction</tspan></text><rect x="56" y="360" width="175" height="110" rx="7" fill="#E8F1FA" stroke="#1764C0" stroke-width="3" /><line x1="114.33333333333334" y1="360" x2="114.33333333333334" y2="470" stroke="#1764C0" stroke-width="2" /><line x1="172.66666666666669" y1="360" x2="172.66666666666669" y2="470" stroke="#1764C0" stroke-width="2" /><line x1="56" y1="396.6666666666667" x2="231" y2="396.6666666666667" stroke="#1764C0" stroke-width="2" /><line x1="56" y1="433.3333333333333" x2="231" y2="433.3333333333333" stroke="#1764C0" stroke-width="2" /><text x="143" y="510" fill="#142434" font-size="26" font-weight="400" text-anchor="middle"><tspan x="143" dy="0">200 W portable</tspan><tspan x="143" dy="33">panel</tspan></text><line x1="239" y1="414" x2="357" y2="414" stroke="#B95412" stroke-width="5" marker-end="url(#orange)" /><rect x="370" y="356" width="330" height="120" rx="14" fill="#FFF4EA" stroke="#B95412" stroke-width="3" /><text x="535" y="404" fill="#142434" font-size="29" font-weight="700" text-anchor="middle"><tspan x="535" dy="0">Installed cable</tspan><tspan x="535" dy="38">and connectors</tspan></text><line x1="709" y1="414" x2="777" y2="414" stroke="#B95412" stroke-width="5" marker-end="url(#orange)" /><rect x="789" y="358" width="235" height="116" rx="12" fill="#F6F8FA" stroke="#142434" stroke-width="3" /><rect x="809" y="374" width="195" height="30" rx="3" fill="#FFFFFF" stroke="#BAC7D5" stroke-width="3" /><text x="906.5" y="398" fill="#142434" font-size="20" font-weight="700" text-anchor="middle"><tspan x="906.5" dy="0">EPEVER</tspan></text><text x="906.5" y="448" fill="#B95412" font-size="29" font-weight="700" text-anchor="middle"><tspan x="906.5" dy="0">PV missing</tspan></text><path d="M 371 496 V 519 H 700 V 496" fill="none" stroke="#B95412" stroke-width="3" /><text x="535" y="555" fill="#B95412" font-size="23" font-weight="700" text-anchor="middle"><tspan x="535" dy="0">Path later isolated by the test</tspan></text><text x="56" y="644" fill="#142434" font-size="33" font-weight="700" text-anchor="start"><tspan x="56" dy="0">2  Direct-panel test</tspan></text><rect x="56" y="690" width="175" height="110" rx="7" fill="#E8F1FA" stroke="#1764C0" stroke-width="3" /><line x1="114.33333333333334" y1="690" x2="114.33333333333334" y2="800" stroke="#1764C0" stroke-width="2" /><line x1="172.66666666666669" y1="690" x2="172.66666666666669" y2="800" stroke="#1764C0" stroke-width="2" /><line x1="56" y1="726.6666666666666" x2="231" y2="726.6666666666666" stroke="#1764C0" stroke-width="2" /><line x1="56" y1="763.3333333333334" x2="231" y2="763.3333333333334" stroke="#1764C0" stroke-width="2" /><text x="143" y="840" fill="#142434" font-size="26" font-weight="400" text-anchor="middle"><tspan x="143" dy="0">Same portable</tspan><tspan x="143" dy="33">panel</tspan></text><line x1="239" y1="744" x2="777" y2="744" stroke="#1764C0" stroke-width="5" marker-end="url(#blue)" /><text x="512" y="716" fill="#1764C0" font-size="29" font-weight="700" text-anchor="middle"><tspan x="512" dy="0">Direct connection</tspan></text><rect x="789" y="688" width="235" height="116" rx="12" fill="#F6F8FA" stroke="#142434" stroke-width="3" /><rect x="809" y="704" width="195" height="30" rx="3" fill="#FFFFFF" stroke="#BAC7D5" stroke-width="3" /><text x="906.5" y="728" fill="#142434" font-size="20" font-weight="700" text-anchor="middle"><tspan x="906.5" dy="0">EPEVER</tspan></text><text x="906.5" y="778" fill="#1764C0" font-size="29" font-weight="700" text-anchor="middle"><tspan x="906.5" dy="0">PV detected</tspan></text><text x="56" y="932" fill="#142434" font-size="35" font-weight="700" text-anchor="start"><tspan x="56" dy="0">Panel + controller worked together.</tspan></text><text x="56" y="982" fill="#617285" font-size="30" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Inspection moved to the installed path.</tspan></text><rect x="56" y="1020" width="968" height="70" rx="12" fill="#EDF4FC" stroke="#1764C0" stroke-width="3" /><text x="540" y="1065" fill="#142434" font-size="29" font-weight="700" text-anchor="middle"><tspan x="540" dy="0">MC4 assembly corrected → solar input restored</tspan></text><line x1="56" y1="1089" x2="1024" y2="1089" stroke="#BAC7D5" stroke-width="2" /><text x="56" y="1128" fill="#617285" font-size="22" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Functional reconstruction • connector locations and wiring order unspecified</tspan></text><text x="56" y="1166" fill="#617285" font-size="21" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Source: projects/mobile-power.md</tspan></text></g></svg>
