<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="629" viewBox="0 0 1200 629" role="img" aria-labelledby="title desc">
<title id="title">SCAMP missing solar input fault isolation</title><desc id="desc">Missing PV input remained despite cable continuity. Direct connection of the 200-watt portable panel to the controller produced detection. The bypass narrowed the fault to the installed wiring and connector path. An improperly assembled MC4 connector was corrected and solar input returned.</desc>
<defs><marker id="measure" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker><marker id="command" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a3412"/></marker></defs>
<rect width="1200" height="629" fill="white"/><g font-family="Arial, Helvetica, sans-serif">
<text x="64" y="60" font-size="32" font-weight="700" fill="#0f172a">SCAMP: isolating missing solar input</text><text x="64" y="98" font-size="19" font-weight="400" fill="#334155">Troubleshooting sequence reconstructed from the installation account</text><rect x="64" y="150" width="247" height="224" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="188" font-size="19" font-weight="700" fill="#0f172a">1  Initial observation</text><text x="80" y="230" font-size="17" font-weight="400" fill="#334155">PV input was missing.</text>
<text x="80" y="257" font-size="17" font-weight="400" fill="#334155">Cable continuity was found.</text>
<text x="80" y="284" font-size="17" font-weight="400" fill="#334155">The installed path still</text>
<text x="80" y="311" font-size="17" font-weight="400" fill="#334155">needed to be isolated.</text>
<rect x="339" y="150" width="247" height="224" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="355" y="188" font-size="19" font-weight="700" fill="#0f172a">2  Bypass the path</text><text x="355" y="230" font-size="17" font-weight="400" fill="#334155">Connected the portable</text>
<text x="355" y="257" font-size="17" font-weight="400" fill="#334155">200 W panel directly</text>
<text x="355" y="284" font-size="17" font-weight="400" fill="#334155">to the controller.</text>
<text x="355" y="311" font-size="17" font-weight="400" fill="#334155">The panel was detected.</text>
<rect x="614" y="150" width="247" height="224" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="630" y="188" font-size="19" font-weight="700" fill="#0f172a">3  Inspect connectors</text><text x="630" y="230" font-size="17" font-weight="400" fill="#334155">The bypass narrowed the</text>
<text x="630" y="257" font-size="17" font-weight="400" fill="#334155">fault to the installed</text>
<text x="630" y="284" font-size="17" font-weight="400" fill="#334155">wiring/connector path.</text>
<text x="630" y="311" font-size="17" font-weight="400" fill="#334155">Found a misassembled MC4.</text>
<rect x="889" y="150" width="247" height="224" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="905" y="188" font-size="19" font-weight="700" fill="#0f172a">4  Correct and check</text><text x="905" y="230" font-size="17" font-weight="400" fill="#334155">Corrected the connector</text>
<text x="905" y="257" font-size="17" font-weight="400" fill="#334155">Tucker had assembled.</text>
<text x="905" y="284" font-size="17" font-weight="400" fill="#334155">Solar input returned.</text>
<text x="905" y="311" font-size="17" font-weight="400" fill="#334155">No yield curve is retained.</text><path d="M311 265 H335" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#measure)"/><path d="M586 265 H610" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#measure)"/><path d="M861 265 H885" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#measure)"/><rect x="64" y="415" width="1072" height="99" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="86" y="455" font-size="22" font-weight="700" fill="#0f172a">Diagnostic decision: test the panel/controller separately from the installed cable path.</text><text x="86" y="490" font-size="20" font-weight="400" fill="#334155">Reported result: correction of the MC4 assembly restored solar input.</text><text x="64" y="564" font-size="17" font-weight="400" fill="#334155">Source: projects/mobile-power.md</text><text x="64" y="596" font-size="17" font-weight="400" fill="#334155">A troubleshooting account; voltage/current logs and a complete wiring drawing are not included.</text>
</g></svg>
