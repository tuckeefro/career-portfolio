name: Portfolio artifacts
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: portfolio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install figure renderers
        run: python3 -m pip install --disable-pip-version-check --no-input CairoSVG==2.7.1 matplotlib==3.9.2
      - name: Check transit arithmetic
        run: python3 artifacts/colorado-transit-award-service/build_crosswalk.py
      - name: Render figures and chart
        run: python3 scripts/render-portfolio.py --write-assets --output /tmp/portfolio-rendered --emit-preview-data --preview-path artifacts/cryogenic-hardware/instrumentation-flow.svg --preview-path artifacts/production-compressed-air/compressed-air-decisions.svg
      - name: Exercise stale export and HTML image checks
        run: |
          python3 - <<'PY'
          import io
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from PIL import Image
          
          project_root = Path.cwd()
          runner = [sys.executable, "scripts/render-portfolio.py", "--check", "--output", "/tmp/portfolio-asset-canary"]
          
          def run_check():
              return subprocess.run(runner, capture_output=True, text=True)
          
          positive = run_check()
          if positive.returncode:
              raise SystemExit(positive.stdout + positive.stderr)
          print("Fresh committed figure assets accepted.")
          
          def expect_rejection(path, changed, reason):
              original = path.read_bytes()
              try:
                  path.write_bytes(changed)
                  result = run_check()
                  if result.returncode == 0 or reason not in result.stdout + result.stderr:
                      raise SystemExit(f"Expected {reason}; got {result.stdout}{result.stderr}")
                  print(f"Detected {reason}; original asset restored.")
              finally:
                  path.write_bytes(original)
          
          png = project_root / "artifacts/fabrication-cnc/waterjet-repair-sequence.png"
          with Image.open(png) as source:
              changed_image = source.convert("RGBA")
              r, g, b, a = changed_image.getpixel((0, 0))
              changed_image.putpixel((0, 0), ((r + 1) % 256, g, b, a))
              stream = io.BytesIO()
              changed_image.save(stream, format="PNG")
              changed_png = stream.getvalue()
          expect_rejection(png, changed_png, "STALE_PNG")
          
          chart = project_root / "artifacts/colorado-transit-award-service/scheduled-frequency.svg"
          expect_rejection(chart, chart.read_bytes() + b"\n<!-- stale export canary -->\n", "STALE_SVG")
          
          with tempfile.TemporaryDirectory(prefix="portfolio-link-canary-", dir=project_root) as directory:
              (Path(directory) / "README.md").write_text('<img src="missing.png" alt="canary" />\n', encoding="utf-8")
              result = subprocess.run([sys.executable, "scripts/verify-portfolio.py"], capture_output=True, text=True)
              if result.returncode == 0 or "missing target missing.png" not in result.stdout + result.stderr:
                  raise SystemExit(f"Expected a missing HTML image error; got {result.stdout}{result.stderr}")
              print("Detected missing HTML image target; temporary document removed.")
          PY
      - name: Verify document links and artifacts
        run: python3 scripts/verify-portfolio.py
      - name: Upload figure previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-figure-previews
          path: /tmp/portfolio-rendered
          if-no-files-found: error
          retention-days: 14
